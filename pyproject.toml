[tool.poetry]
name = "oko-test-harness"
version = "0.2.0"
description = "Release-gate test harness for the OpenSearch Kubernetes Operator"
authors = ["BigData Boutique <itamar@bigdataboutique.com>"]
readme = "README.md"
packages = [{include = "oko_test_harness"}]

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0.1"
requests = "^2.31.0"
click = "^8.1.7"
loguru = "^0.7.2"
bcrypt = "^4.0.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
ruff = "^0.6"

[tool.poetry.scripts]
oko-test = "oko_test_harness.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 200
target-version = "py39"
