metadata:
  description: "Same as 50-operator-upgrade but the legacy cluster stores dashboards.replicas: 1 (dashboards still disabled), which sidesteps FINDINGS-round3 N25 so the migration to opensearch.org and the post-migration OpenSearch upgrade are exercised"

config:
  opensearch:
    api_group: "opensearch.opster.io"

phases:
  - name: setup_with_released_operator
    steps:
      - action: setup_cluster
      - action: install_operator
        # chart 2.8.0 is the last published chart that runs a 2.x operator (see FINDINGS-round3 N22); its kube-rbac-proxy
        # sidecar image gcr.io/kubebuilder/kube-rbac-proxy no longer exists, so the metrics proxy is disabled
        params: {version: "${OPERATOR_PREV:-2.8.0}", values: {"kubeRbacProxy.enable": "false"}}
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_2X:-2.19.6}"
          dashboards: {enabled: false, replicas: 1}  # see description
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
        params: {timeout: 25m}  # operator 2.8 starts pods one by one (OrderedReady)
      - action: index_documents
        params: {index: data-a, count: 3000, shards: 3, replicas: 1}

  - name: upgrade_operator
    steps:
      - action: upgrade_operator
        # the 3.x reconciler recreates the StatefulSet (new label selector), creates a transient bootstrap pod, re-runs the
        # securityconfig job and rolling-restarts every node once it adopts the migrated CR (FINDINGS-round3 N26); the
        # observer still enforces one node out at a time, health >= yellow and no document loss
        params: {version: local, expect_restart: true}
      - action: validate_operator_status
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 3000}

  - name: migrated_api_group
    steps:
      - action: set_api_group
        params: {api_group: opensearch.org}
      - action: wait_for_cluster_ready
      - action: index_documents
        params: {index: data-b, count: 1000, replicas: 1}
      - action: upgrade_cluster
        params: {target_version: "${OS_VERSION_3X_OLD:-3.0.0}", max_unready_pods: 1}
      - action: wait_for_cluster_ready
        params: {expect_version: "${OS_VERSION_3X_OLD:-3.0.0}"}
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 3000}
      - action: validate_data_integrity
        params: {index: data-b, expected_documents: 1000}
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
