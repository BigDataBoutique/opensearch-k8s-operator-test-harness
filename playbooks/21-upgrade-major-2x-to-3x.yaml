metadata:
  description: "Major upgrade 2.19.x -> 3.0.x with dedicated managers + data pools, existing data, live indexing, then new data in 3.x"

phases:
  - name: setup
    steps:
      - action: setup_cluster
      - action: install_operator
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_2X:-2.19.6}"
          node_pools:
            - {component: masters, replicas: 3, roles: ["cluster_manager"]}
            - {component: data, replicas: 3, roles: ["data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: index_documents
        params:
          index: data-2x
          count: 5000
          shards: 3
          replicas: 1
          document_template: |
            {"id": {id}, "timestamp": "{timestamp}", "version": "2.x", "message": "created on 2.x {id}", "level": "{random:INFO,WARN,ERROR}", "value": {id}}
      - action: validate_data_integrity
        params: {index: data-2x, expected_documents: 5000}

  - name: upgrade
    steps:
      - action: index_documents
        background: true
        params: {index: data-live, count: 200, replicas: 1, duration: 10m, min_success_ratio: 0.95}
      - action: upgrade_cluster
        params: {target_version: "${OS_VERSION_3X_OLD:-3.0.0}", max_unready_pods: 1}

  - name: verify
    steps:
      - action: wait_for_cluster_ready
        params: {expect_version: "${OS_VERSION_3X_OLD:-3.0.0}"}
      - action: validate_cluster_version
        params: {expected_version: "${OS_VERSION_3X_OLD:-3.0.0}"}
      - action: validate_cluster_configuration
        params: {total_nodes: 6, roles: {cluster_manager: 3, data: 3}}
      - action: validate_data_integrity
        params:
          index: data-2x
          expected_documents: 5000
          sample_queries:
            - {query: '{"term": {"version": "2.x"}}', expected_hits: 5000}
      - action: query_documents
        params: {index: data-live, expected_min_count: 5000}
      - action: index_documents
        params: {index: data-3x, count: 2000, replicas: 1}
      - action: validate_data_integrity
        params: {index: data-3x, expected_documents: 2000}
      - action: validate_node_configuration
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
