metadata:
  description: "Issue #1455 (fixed by 7c8d58e): emptyDir recovery may only fire on genuinely missing pods, after a 5-minute grace period. The JVM of all three emptyDir nodes is frozen (SIGSTOP) for 3 minutes so readiness and liveness probes fail cluster-wide while the pods and their volumes stay in place; the operator must not tear the StatefulSet down (no 'Recreating emptyDir cluster' event, same pod UIDs) and the cluster must come back RUNNING/green with every document. Unfixed operators deleted every StatefulSet on a single not-ready sample: operator-inflicted total data loss."

phases:
  - name: setup
    steps:
      - action: setup_cluster
      - action: install_operator
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X:-3.8.0}"
          extra_spec:
            nodePools:
              - component: nodes
                replicas: 3
                roles: ["cluster_manager", "data", "ingest"]
                diskSize: 5Gi
                resources: {requests: {cpu: 250m, memory: 1Gi}, limits: {cpu: "2", memory: 2Gi}}
                jvm: "-Xmx768m -Xms768m"
                persistence: {emptyDir: {}}
      - action: wait_for_cluster_ready
      - action: index_documents
        params: {index: data-a, count: 2000, shards: 3, replicas: 1}

  - name: readiness_blip
    steps:
      - action: pause_pods
        params: {component: nodes, duration: 3m, timeout: 15m}
      - action: wait_for_cluster_ready
      - action: check_k8s_resource
        params: {kind: statefulset, name: __CLUSTER__-nodes, expect: {status.readyReplicas: 3}}
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 2000}
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
