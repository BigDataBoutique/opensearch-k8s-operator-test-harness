metadata:
  description: "general.additionalVolumes (configMap + secret), general.keystore with keyMappings and nodePools[].additionalConfig: the files, keystore keys and per-pool settings are present inside the pods, and a changed volume with restartPods: true rolls the pods"

phases:
  - name: setup
    steps:
      - action: setup_cluster
      - action: install_operator
      - action: apply_resource
        params:
          manifest: {apiVersion: v1, kind: ConfigMap, metadata: {name: oko-extra-config}, data: {hello.txt: "hello from configmap v1"}}
      - action: apply_resource
        params:
          manifest: {apiVersion: v1, kind: Secret, metadata: {name: oko-extra-secret}, stringData: {token.txt: "s3cr3t-token"}}
      - action: apply_resource
        params:
          # keystore keys must be secure settings some installed plugin declares, otherwise the node refuses to start;
          # repository-s3 is installed below and custom_secret is mapped onto its secret_key via keyMappings
          manifest: {apiVersion: v1, kind: Secret, metadata: {name: oko-keystore}, stringData: {"s3.client.default.access_key": "AKIAOKO", "custom_secret": "keystore-value"}}
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X:-3.8.0}"
          node_pools:
            - component: nodes
              replicas: 3
              roles: ["cluster_manager", "data", "ingest"]
              additionalConfig: {"node.attr.zone": "zone-a", "node.attr.pool": "nodes"}
          extra_spec:
            general:
              additionalVolumes:
                - {name: extra-config, path: /usr/share/opensearch/extra/config, configMap: {name: oko-extra-config}, restartPods: true}
                - {name: extra-secret, path: /usr/share/opensearch/extra/secret, secret: {secretName: oko-extra-secret}}
              pluginsList: ["repository-s3"]
              keystore:
                - {secret: {name: oko-keystore}, keyMappings: {"s3.client.default.access_key": "s3.client.default.access_key", custom_secret: "s3.client.default.secret_key"}}  # only mapped keys are loaded (documented)
      - action: wait_for_cluster_ready

  - name: verify
    steps:
      - action: check_pod_exec
        params:
          all_pods: true
          command: "cat extra/config/hello.txt extra/secret/token.txt && bin/opensearch-keystore list"
          contains: ["hello from configmap v1", "s3cr3t-token", "s3.client.default.access_key", "s3.client.default.secret_key"]  # bootstrap.password is only added when the operator manages the admin password (no custom securityconfig)
          absent: ["custom_secret\n"]
      - action: check_pod_exec
        params:
          all_pods: true
          command: "grep -E 'node.attr' config/opensearch.yml"
          contains: ["node.attr.zone: zone-a", "node.attr.pool: nodes"]
      - action: check_opensearch_api
        params:
          path: /_cat/nodeattrs?format=json&h=node,attr,value
          expect: {"$": [{attr: zone, value: zone-a}, {attr: pool, value: nodes}]}
      - action: check_k8s_resource
        params:
          kind: pod
          component: nodes
          expect:
            spec.volumes: [{name: extra-config, configMap: {name: oko-extra-config}}, {name: extra-secret, secret: {secretName: oko-extra-secret}}, {name: keystore}]
            spec.initContainers: [{name: keystore}]
      - action: index_documents
        params: {index: data-a, count: 1000, shards: 3, replicas: 1}

  - name: volume_change_rolls_pods
    steps:
      - action: apply_resource
        params:
          manifest: {apiVersion: v1, kind: ConfigMap, metadata: {name: oko-extra-config}, data: {hello.txt: "hello from configmap v2"}}
      - action: patch_cluster
        params: {expect_restart: true, wait_running: true}
      - action: wait_for_cluster_ready
      - action: check_pod_exec
        params: {all_pods: true, command: "cat extra/config/hello.txt", contains: ["hello from configmap v2"]}
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 1000}
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
