metadata:
  description: "Deleting a cluster retains its PVCs and a re-created cluster with the same name recovers the data from them; deleting the CR in the middle of an upgrade completes; a CR deleted while the operator is down is finished by the operator when it returns; deleting the namespace directly is not blocked by operator finalizers"

phases:
  - name: setup
    steps:
      - action: setup_cluster
      - action: install_operator
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X_OLD:-3.0.0}"
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: index_documents
        params: {index: data-a, count: 2000, shards: 3, replicas: 1}

  - name: pvcs_retained_and_reused
    steps:
      - action: delete_cluster_check_pvcs
        params: {expect_retained: true}
      - action: check_k8s_resource
        params: {kind: pvc, selector: "opensearch.org/opensearch-cluster=__CLUSTER__", min_count: 3}
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X_OLD:-3.0.0}"
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 2000}

  - name: delete_during_upgrade
    steps:
      - action: patch_cluster
        params: {patch: {spec: {general: {version: "${OS_VERSION_3X:-3.8.0}"}}}, wait_phase: UPGRADING}
      - action: delete_cluster
        params: {timeout: 10m}
      - action: check_k8s_resource
        params: {kind: statefulset, exists: false, selector: "opensearch.org/opensearch-cluster=__CLUSTER__"}
      - action: validate_operator_status

  - name: delete_while_operator_down
    description: "The CR is deleted while the operator is scaled to zero; the finalizer must hold, and the returned operator must finish the deletion (no deadlock, no orphaned pods)"
    steps:
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X:-3.8.0}"
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: scale_operator
        params: {replicas: 0}
      - action: delete_resource
        params: {kind: opensearchclusters.opensearch.org, name: __CLUSTER__, wait_gone: false}
      - action: check_k8s_resource
        params: {kind: opensearchclusters.opensearch.org, name: __CLUSTER__, expect: {metadata.finalizers: [Opensearch]}}
      - action: scale_operator
        params: {replicas: 1}
      - action: check_k8s_resource
        params: {kind: opensearchclusters.opensearch.org, name: __CLUSTER__, exists: false, timeout: 10m}
      - action: check_k8s_resource
        params: {kind: pod, component: nodes, exists: false, timeout: 5m}
      - action: validate_operator_status

  - name: namespace_deletion
    steps:
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X:-3.8.0}"
          node_pools:
            # 3 managers: a 1-manager cluster never forms on the current operator (FINDINGS-new.md N10 / issue #1448,
            # covered by playbooks 81-82); this phase is about namespace deletion, not quorum
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: delete_namespace
        params: {timeout: 10m}
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
