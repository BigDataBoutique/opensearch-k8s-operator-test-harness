metadata:
  description: "Deleting a cluster retains its PVCs and a re-created cluster with the same name recovers the data from them; deleting the CR in the middle of an upgrade completes; deleting the namespace directly is not blocked by operator finalizers"

phases:
  - name: setup
    steps:
      - action: setup_cluster
      - action: install_operator
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X_OLD:-3.0.0}"
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: index_documents
        params: {index: data-a, count: 2000, shards: 3, replicas: 1}

  - name: pvcs_retained_and_reused
    steps:
      - action: delete_cluster_check_pvcs
        params: {expect_retained: true}
      - action: check_k8s_resource
        params: {kind: pvc, selector: "opensearch.org/opensearch-cluster=__CLUSTER__", min_count: 3}
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X_OLD:-3.0.0}"
          node_pools:
            - {component: nodes, replicas: 3, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
      - action: validate_data_integrity
        params: {index: data-a, expected_documents: 2000}

  - name: delete_during_upgrade
    steps:
      - action: patch_cluster
        params: {patch: {spec: {general: {version: "${OS_VERSION_3X:-3.8.0}"}}}, wait_phase: UPGRADING}
      - action: delete_cluster
        params: {timeout: 10m}
      - action: check_k8s_resource
        params: {kind: statefulset, exists: false, selector: "opensearch.org/opensearch-cluster=__CLUSTER__"}
      - action: validate_operator_status

  - name: namespace_deletion
    steps:
      - action: deploy_cluster
        params:
          version: "${OS_VERSION_3X:-3.8.0}"
          node_pools:
            - {component: solo, replicas: 1, roles: ["cluster_manager", "data", "ingest"]}
      - action: wait_for_cluster_ready
        params: {health: yellow}
      - action: delete_namespace
        params: {timeout: 10m}
      - action: validate_operator_status

  - name: teardown
    steps:
      - action: delete_cluster
