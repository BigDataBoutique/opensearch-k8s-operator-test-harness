# Defaults for every playbook. Any playbook `config:` section overrides these, and ${VAR:-default} env substitution works here too.

kubernetes:
  provider: "${OKO_PROVIDER:-k3d}"     # k3d | kind | existing (uses current kubectl context)
  cluster_name: "${OKO_K8S_CLUSTER:-oko}"
  nodes: 3                                # worker/agent nodes for k3d/kind
  cleanup_on_success: false               # the k8s cluster is reused between playbooks; namespaces are always deleted
  cleanup_on_failure: false               # keep the namespace for inspection when a playbook fails

opensearch:
  operator_version: "local"               # "local" = build ../opensearch-k8s-operator and install its chart; otherwise a chart version
  local_operator_path: "${OKO_OPERATOR_PATH:-../opensearch-k8s-operator}"
  operator_namespace: "opensearch-operator-system"
  api_group: "opensearch.org"             # opensearch.org (current) or opensearch.opster.io (legacy)
  opensearch_version: "${OS_VERSION_3X:-3.8.0}"
  disk_size: "5Gi"
  # k3d/kind volumes report the host disk usage; a busy laptop is often above the default 85% watermark, which silently
  # blocks replica allocation. These go into opensearch.yml (general.additionalConfig) of every cluster the harness deploys.
  default_cluster_settings:
    "cluster.routing.allocation.disk.watermark.low": "97%"
    "cluster.routing.allocation.disk.watermark.high": "98%"
    "cluster.routing.allocation.disk.watermark.flood_stage": "99%"
  jvm_heap: "-Xmx768m -Xms768m"
  node_resources:
    requests: {cpu: "250m", memory: "1Gi"}
    limits: {cpu: "2", memory: "2Gi"}

timeouts:                                 # generous for a laptop; a step that exceeds these is almost certainly stuck
  deployment: "15m"                       # CR applied -> RUNNING + green
  upgrade: "25m"                          # whole rolling upgrade (3-6 nodes)
  scaling: "15m"                          # scale/add/remove pool -> settled green
  recovery: "10m"                         # pod/operator/node failure -> RUNNING + green
  step: "40m"                             # hard backstop: any single foreground step longer than this fails the playbook
